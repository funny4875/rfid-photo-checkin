<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFID 後台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="admin-shell">
    <div class="topbar">
      <h1>RFID 後台 <small id="app-version">v-</small></h1>
      <a class="link-button" href="/">前台</a>
    </div>
    <div class="admin-actions">
      <button id="merge-now" type="button">整併今日記錄</button>
      <button id="archive-now" type="button">清理歸檔</button>
      <span id="admin-status"></span>
    </div>
    <section class="student-import-panel">
      <div class="panel-header">
        <h2>學生資料更新</h2>
        <div class="record-actions">
          <button id="upload-student-data" type="button">上傳更新學生資料</button>
          <a class="link-button" href="/api/admin/student-template">下載學生資料excel格式</a>
        </div>
      </div>
      <form id="student-upload-form" class="student-upload-form">
        <input id="student-file" name="student_file" type="file" accept=".xlsx" hidden>
      </form>
      <p class="panel-note">上傳後會覆寫後端的 student_data.txt，系統會先備份舊檔。</p>
    </section>
    <section class="locations-panel">
      <div class="panel-header">
        <h2>場域設定</h2>
        <div class="record-actions">
          <button id="add-location" type="button">新增場域</button>
          <button id="save-locations" type="button">儲存場域</button>
        </div>
      </div>
      <div id="locations-list" class="locations-list"></div>
    </section>
    <section class="admin-grid">
      <article class="merged">
        <h2>今日整併</h2>
        <div id="merged-records" class="records-list compact"></div>
      </article>
    </section>
  </main>
  <script src="/static/admin.js"></script>
</body>
</html>
